# Publishes the site to Firebase Hosting whenever main changes.
# The deploy key lives in the repository secret FIREBASE_SERVICE_ACCOUNT.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-live
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: nerdicas-mini-games
