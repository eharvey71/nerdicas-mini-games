<!DOCTYPE html>

<head>

<title>Dead end</title>
<style>
:root{--fg:#33ff66;--bg:#000000;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace}

<body>
<main>
  <h1>A WALL.</h1>
