/* ---------- 1-bit framebuffer ---------- */

  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy,n=0;

const ART={};for(const k in RAW)ART[k]=RAW[k].split(';').map(p=>p.trim().split(' ').map(c=>c.split(',').map(Number)));
function drawArt(a,k){for(const p of a){const q=p.map(([x,y])=>[(x-10)/10*.75,y/10*.85]);if(q.length===1)q.push(q[0]);poly(q,k)}}

/* ---------- dungeon ---------- */
const N=20,MAXL=20,START=10,DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
let levels={},seen={};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function edge(lv,x,y,dir){
  if(dir===0)return y===0?1:lv.wn[y*N+x];
  if(dir===2)return y===N-1?1:lv.wn[(y+1)*N+x];
  if(dir===3)return x===0?1:lv.ww[y*N+x];
  return x===N-1?1:lv.ww[y*N+x+1];
}
function setEdge(lv,x,y,dir,v){if(dir===0)lv.wn[y*N+x]=v;else if(dir===2)lv.wn[(y+1)*N+x]=v;else if(dir===3)lv.ww[y*N+x]=v;else lv.ww[y*N+x+1]=v}
function genLevel(dp){
  const r=mulberry(g.seed*131+dp*7919),ri=n=>Math.floor(r()*n);
  const lv={wn:new Uint8Array(N*N).fill(1),ww:new Uint8Array(N*N).fill(1),feat:{}};

    const i=o[ri(o.length)],nx=x+DIRS[i][0],ny=y+DIRS[i][1];setEdge(lv,x,y,i,0);vis[ny*N+nx]=1;st.push([nx,ny]);
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const dir of[0,3]){
    if((dir===0&&y===0)||(dir===3&&x===0))continue;
    if(edge(lv,x,y,dir)===1&&r()<.22)setEdge(lv,x,y,dir,0);
    if(edge(lv,x,y,dir)===0&&r()<.12)setEdge(lv,x,y,dir,2);
  }
  const put=(t,n)=>{for(let i=0;i<n;i++){let c,tries=0;do{c=ri(N*N)}while((lv.feat[c]||c===START*N+START)&&tries++<50);lv.feat[c]=t}};
  if(dp===1)lv.feat[START*N+START]='U';
  if(dp<MAXL){put('D',3);put('P',3)}
  put('U',2);put('F',2);put('T',1);put('A',1);put('X',2);put('C',1);if(dp===MAXL&&!g.crown)put('K',1);

}
const levelAt=dp=>levels[dp]||(levels[dp]=genLevel(dp));const lvl=()=>levelAt(g.depth);
const seenArr=()=>seen[g.depth]||(seen[g.depth]=new Uint8Array(N*N));
const mark=()=>{seenArr()[g.y*N+g.x]=1};
const feat=()=>lvl().feat[g.y*N+g.x];

function drawSide(lv,sg,i,x,y,sd){
  const e=edge(lv,x,y,sd);
  if(e){
    L3(sg,0,i,sg,0,i+1);L3(sg,2,i,sg,2,i+1);L3(sg,0,i+1,sg,2,i+1);L3(sg,0,i,sg,2,i);

  }else{
    const nx=x+DIRS[sd][0],ny=y+DIRS[sd][1];
    if(edge(lv,nx,ny,g.dir)){const xo=sg*sc(i)/sc(i+1);L3(sg,0,i+1,xo,0,i+1);L3(sg,2,i+1,xo,2,i+1);L3(sg,0,i+1,sg,2,i+1)}
  }
}
function drawFeature(t,i){
  const k=i+.5,a=i+.25,b=i+.8;
  const quad=y=>{L3(-.5,y,a,.5,y,a);L3(.5,y,a,.5,y,b);L3(.5,y,b,-.5,y,b);L3(-.5,y,b,-.5,y,a)};
  if(t==='D'){quad(0);for(const q of[.4,.55,.68])L3(-.5,0,i+q,.5,0,i+q)}
  else if(t==='U'){quad(2);L3(-.2,0,k,-.2,2,k);L3(.2,0,k,.2,2,k);for(let y=.25;y<2;y+=.25)L3(-.2,y,k,.2,y,k)}

  else if(t==='F'){poly([[-.3,0],[-.45,.45],[.45,.45],[.3,0]],k,1);poly([[0,.45],[0,.9]],k);poly([[0,.9],[-.2,1.05],[-.3,.75]],k);poly([[0,.9],[.2,1.05],[.3,.75]],k)}
  else if(t==='T'){poly([[-.3,0],[-.3,1.5],[0,1.7],[.3,1.5],[.3,0]],k);poly([[-.3,.55],[.3,.55]],k);poly([[-.3,.85],[-.42,.85],[-.42,0]],k);poly([[.3,.85],[.42,.85],[.42,0]],k)}

  const now=Date.now();let again=false;
  const it=(G,k,label,val,num,cls,bar)=>{
    val=String(val);const p=prevS[k];
    if(p&&p.val!==val)flashT[k]={until:now+700,dUntil:now+1900,d:typeof num==='number'&&typeof p.num==='number'?num-p.num:0};
    prevS[k]={val,num};
    if(val==='')return;
    const f=flashT[k],e=mk('span','it'+(cls?' '+cls:'')+(f&&now<f.until?' flash':''));
    if(label)e.appendChild(mk('span','lab',label));e.appendChild(mk('span','val',val));
    if(bar){const b=mk('span','bar'),i=mk('i');i.style.width=clamp(Math.round(bar[0]/Math.max(1,bar[1])*100),0,100)+'%';b.appendChild(i);e.appendChild(b)}
    if(f&&now<f.dUntil&&f.d){const kk=String(k).replace(/\d+$/,''),gd=['depth'].includes(kk)?0:(f.d>0)!==['foe'].includes(kk)?1:-1;e.appendChild(mk('span','dl'+(gd>0?' up':gd<0?' dn':''),(f.d>0?'+':'\u2212')+Math.abs(f.d)))}
    if(f&&now<f.dUntil)again=true;
    G.appendChild(e);
  };
  const made=mode!=='create';
  let G=grp('VITALS');
  it(G,'lvl','LVL',g.lvl+(made?' '+kit().n:''),g.lvl);
  it(G,'hp','HP',`${g.hp}/${g.mhp}`,g.hp,'hp'+(g.hp<=g.mhp/3?' low':''),[g.hp,g.mhp]);
  it(G,'sp','SP',`${g.sp}/${g.msp}`,g.sp,'sp',[g.sp,g.msp]);
  G=grp('WEALTH');
  it(G,'gold','GOLD',g.gold,g.gold,'gold');
  it(G,'xp','XP',`${g.xp}/${need()}`,g.xp,'xp',[g.xp,need()]);
  G=grp('STATS');
  for(const k of STATS)it(G,k,k.toUpperCase(),g[k],g[k]);
  if(made){
    G=grp('GEAR');
    it(G,'sw','SWORD','+'+g.sw,g.sw);it(G,'ar','ARMOR','+'+g.ar,g.ar);it(G,'sh','SHIELD','+'+g.sh,g.sh);it(G,'rp','RING',g.rp?'+'+g.rp:'',g.rp||0);
    for(const [k,n] of [['regen','REGEN'],['boots','BOOTS'],['amu','AMULET'],['crown','CROWN']])it(G,k,'',g[k]?n:'');
    it(G,'ward','',g.ward>0?'WARD':'');
    G=grp('PACK');let any=false;
    for(const [k,n] of [['pot','POTION'],['elx','ELIXIR'],['wand','WAND'],['scr','RECALL']]){const v=g[k]||0;if(v)any=true;it(G,k,n,v?v:'',v)}
    if(!any)txt(G,'empty');
    if(mode!=='inn'||mon||showMap){
      G=grp('HERE');
      if(mode!=='inn'){it(G,'depth','DEPTH',g.depth,g.depth);txt(G,`FACING ${'NESW'[g.dir]}  AT ${g.x},${g.y}`)}
      if(showMap){const a=seen[mapD],n=a?a.reduce((x,y)=>x+y,0):0,ks=Object.keys(seen).map(Number);txt(G,`MAP LEVEL ${mapD}`);txt(G,`EXPLORED ${Math.round(n/(N*N)*100)}%`);txt(G,`DEEPEST ${ks.length?Math.max(...ks):1}`)}
      if(mon){const q=mon.hp/mon.mhp;it(G,'foe','FOE',`L${mon.lvl} ${mon.t.n} ${mon.sleep?'ASLEEP':q>.66?'HALE':q>.33?'WOUNDED':'FALTERING'}`,undefined,'foe')}else prevS.foe=undefined;
    }
  }
  clearTimeout(stT);if(again)stT=setTimeout(drawStatus,400);
}
let cur=[];
function drawScene(){
  if(mode==='title')drawTitle();
  else if(showMap&&(mode==='explore'||mode==='inn'))drawMap();
  else if(mode==='create')drawArt(ART.chest,1.2);
  else if(mode==='inn')drawArt(ART.inn,.35);
  else if(mode==='dead')drawArt(ART.tomb,.5);
  else{drawDungeon();if(mon)drawArt(ART[mon.t.a],.55);if(mode==='chest')drawArt(ART.chest,1)}
}
function render(){
  cls();drawScene();flush();
  // overlay
  const o=$('ovl');o.style.display=help||codeUI?'block':'none';if(help||codeUI)$('ban').style.display='none';
  if(codeUI==='show'){o.innerHTML='<p>This code is your delver as saved at the Inn. Paste it into ENTER CODE on the title screen of any device.</p><textarea id="code" readonly aria-label="Save code"></textarea><p id="codemsg"></p>';$('code').value=makeCode()}
  else if(codeUI==='enter')o.innerHTML='<p>Paste a save code, then press LOAD. It replaces any delver saved on this device.</p><textarea id="code" aria-label="Save code" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><p id="codemsg"></p>';
  else
  if(help)o.innerHTML='<p>Twenty levels down, the HOLLOW KING wears a crown. Kill him, carry the crown back up to the Inn, and you have won. Death is permanent.</p><p>MOVE with the pad, arrow keys or WASD. Doors open as you walk through.</p><p>Gold does nothing below ground. Carry it up to the INN (the ladder where you start on level 1). There you can TRADE GOLD for experience, one for one, or spend it in the SHOP on potions, elixirs, recall scrolls and wand charges. Shop prices rise with your level. The Inn also heals you.</p>'
   +'<h2>CLASSES</h2><ul><li>FIGHTER: d9 hit points a level, +5% to hit, +1 damage, starts with a sword +1. Needs twice the level for each spell and gains spell points slowly.</li><li>MAGE: d6 hit points a level, 5% worse to hit. Extra spell points, stronger spells, starts with an elixir.</li><li>THIEF: d7 hit points a level, EVADE 20% surer, never falls in pits, spots mimics, fewer chest traps, 25% more gold, and sometimes strikes first for double damage. Needs half again the level for each spell. Starts with a recall scroll.</li></ul><p>When a monster appears: FIGHT, CAST or EVADE. Deeper levels are meaner and richer.</p><p>Fountains, thrones and altars can help or harm. Pits drop you a level. Floating diamonds teleport you. A misty cube lets you jump to a level of your choice. Each fountain, throne and altar works once, then stays spent until your next visit to the Inn.</p><p>MAP shows where you have walked. U and D mark stairs. The game saves only at the Inn. Quit below ground and you wake at your last Inn visit; die and the delver is gone. SAVE CODE at the Inn gives a code that carries your delver to another device.</p>'
   +'<h2>ATTRIBUTES</h2><ul><li>STR: chance to hit (2% a point) and melee damage.</li><li>INT: spell points and spell power. At 14 or more, 2 SP a level instead of 1.</li><li>DEX: dodging blows (1% a point), EVADE (3% a point) and stepping around pits.</li><li>CON: hit points at the start and at each level.</li></ul><p>Rolled 3d6 each. Fountains and altars can change them.</p>'
   +'<h2>WEAPONS AND GEAR</h2><ul><li>SWORD +N: N more damage, 2N% better to hit.</li><li>ARMOR +N, SHIELD +N, RING of protection +N: each point makes you 2% harder to hit.</li><li>RING of regeneration: 1 HP every 3 steps.</li><li>ELVEN BOOTS: EVADE is 20% surer.</li><li>POTION: heals 2d8 plus twice your level.</li><li>SCROLL of recall: carries you to the Inn, even mid-fight.</li><li>ELIXIR: restores all spell points.</li><li>WAND of fire: each charge burns a foe for 3d6 plus your level.</li><li>AMULET of life: cheats death once, leaving you at half health.</li></ul><p>You start bare-handed at +0. Better finds replace what you carry; deeper levels hold bigger bonuses.</p>'
   +'<h2>SPELLS</h2><ul>'+SPELLS.map(x=>`<li>${x.n}, ${x.c} SP, level ${x.l}: ${x.d}</li>`).join('')+'</ul><p>Levels shown are for a mage. INT above 11 adds to damage, healing and the odds of SLUMBER, TURN and DOOM. Spell points return at the Inn, and sometimes at fountains and altars.</p>'
   +'<h2>MONSTERS</h2><p>Seventeen kinds, meaner with depth. Bats are hard to hit. Goblins steal. Spiders poison. Trolls heal as they fight. Gargoyles shrug off blades, so use spells. Wraiths and vampires drain experience. Dragons and demons breathe fire. Liches cast.</p><p>TURN works on the undead: skeletons, zombies, wraiths, vampires and liches. Now and then a monster comes in peace and leaves a gift.</p>';
  drawStatus();
  // log
  const lg=$('log');lg.textContent='';
  for(const s of(mode==='title'?['Somewhere below, gold. Somewhere below that, worse.','Twenty levels down, a dead king wears a crown.']:showMap?['U up   D down   F fountain   T throne','A altar  P pit  X teleporter  C cube  K king','Gaps in walls are doors. The arrow is you.']:lines)){const e=document.createElement('div');e.textContent=s;lg.appendChild(e)}
  // pad
  cur=buttons();const pad=$('pad');pad.textContent='';
  cur.forEach(b=>{const e=document.createElement('button');e.type='button';if(b){e.textContent=b.t;e.onclick=()=>{if(busy)return;wake();e.blur();b.f()}}else{e.disabled=true;e.textContent='·'}pad.appendChild(e)});
  if(g&&mode==='inn')save();
  if(winB){winB=false;lvUp=null;banner({stay:1,lines:[['VICTORY'],['THE CROWN','big'],[`Level ${g.lvl} ${kit().n}. ${g.kills} kills. ${g.steps} steps.`],['The deep is yours. Tap to go on.']]})}
  else if(lvUp){const l=lvUp;lvUp=null;banner(l)}
}
addEventListener('keydown',ev=>{
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(ev.target&&ev.target.tagName==='TEXTAREA'&&ev.key!=='Escape')return;
  const k=ev.key.length===1?ev.key.toLowerCase():ev.key,b=cur.find(b=>b&&b.k.includes(k));
  if(b){ev.preventDefault();if(!busy){wake();b.f()}}
});
try{const tv=localStorage.getItem('nmg.tone');hueI=(+(tv!==null?tv:localStorage.getItem('hollowdeep.hue'))||0)%HUES.length;const v=localStorage.getItem('hollowdeep.vol');vol=v===null?(localStorage.getItem('hollowdeep.mute')==='1'?0:1):clamp(+v||0,0,2);muted=vol===0}catch(e){}
setSnd();
setHue();render();
</script>
